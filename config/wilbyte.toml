# RYTE brand + workflow defaults.
# These encode the choices Wil makes by hand on every post (see README).

[brand]
name = "Agent Lead Lab"
site_domain = "agentleadlab.com"
# Canonical link is always https://<site_domain>/post/<url-slug>
canonical_path_prefix = "/post/"

[post]
# Category is always LeadLab.
category = "LeadLab"
# Author is always Arnold "Tre" Tarpley.
author = 'Arnold "Tre" Tarpley'
# The same keyword set goes on every post. These become the post's tags in GHL.
keywords = [
  "agentleadlab",
  "lead lab",
  "life insurance leads",
  "mtg leads",
  "final expense leads",
  "iul leads",
  "vet leads",
  "fex",
  "iul",
  "vet",
  "mtg",
  "lifeinsurance",
  "life insurance agent",
]

[schedule]
# One post per weekday at 10:00 AM Eastern. Never Saturday or Sunday.
# America/New_York, not a fixed -05:00, so 10:00 stays 10:00 across the DST
# switch rather than drifting to 11:00 for half the year.
time = "10:00"
timezone = "America/New_York"
weekdays_only = true
# GHL rejects schedules less than ~15 minutes out.
min_lead_minutes = 20
# Never schedule before this day. GHL reports some posts without a schedule,
# so those days read as free and get booked twice - set this past the last day
# you know is taken. Leave empty to trust the blog calendar alone.
earliest_day = ""

[cover]
# 1200x630 - the standard social/OG preview size. Wider than GHL's suggested
# 600x400, which cramped long headlines onto three or four lines.
width = 1200
height = 630
# The cover headline is trimmed to this many characters. Characters, not words,
# because what actually matters is rendered width - "up a lead tier" costs far
# less room than "generation momentum". Past this the type shrinks onto three
# or four lines and stops reading as a poster.
headline_max_chars = 46
# The highlighted kicker above the headline is 3-5 words, taken from one of the
# headline options. The big headline below it is a different headline option.
kicker_min_words = 3
kicker_max_words = 5
# Alt text for the cover image is the URL slug (matching Wil's manual process).
alt_text_source = "url_slug"

[discord]
# Show each finished post in Discord (cover image, title, slug, slot) and wait
# for an Approve click before anything is created in GHL.
require_approval = true
# How long an approval prompt stays live before the post is skipped.
approval_timeout_minutes = 60
# Max videos a single /run may process, so one command can't burn the playlist.
max_batch = 10

[copy]
model = "claude-opus-5"
max_tokens = 16000
# Meta title / description limits enforced on the model output.
meta_title_max = 60
meta_description_max = 160
