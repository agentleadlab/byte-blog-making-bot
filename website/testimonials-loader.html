<!-- ============================================================
     VIDEO TESTIMONIALS — kept up to date by RYTE.
     leadlabcrm.com: paste ONCE at the very end of the page's HTML.
     GHL funnels: paste ONCE per funnel in Settings -> Tracking Code
     -> Footer Code. It reads the list RYTE keeps on leadlabcrm.com
     and redraws the video section - either version of it - with the
     page's own cards. Pages without the section are left alone.
     If the list can't be read, the videos already in the page stay
     exactly as they are.
     ============================================================ -->
<script>
(function(){
  var LL_SITE = 'https://leadlabcrm.com';
  var LL_DATA = LL_SITE + '/wp-json/wp/v2/pages?slug=ll-videos-data&_fields=content';

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function fromHex(h){
    var bytes = new Uint8Array(h.length / 2);
    for (var i = 0; i < bytes.length; i++) bytes[i] = parseInt(h.substr(i * 2, 2), 16);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }
  function card(v){
    return '<div class="ll-video-card ll-fadein">' +
      '<button type="button" class="ll-video-frame" data-vid="' + esc(v.id) + '" aria-label="Play the interview with ' + esc(v.name) + '">' +
        '<img src="https://img.youtube.com/vi/' + esc(v.id) + '/mqdefault.jpg" loading="lazy" decoding="async" width="320" height="180" alt="">' +
        '<span class="ll-play-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>' +
      '</button>' +
      '<div class="ll-video-meta"><div class="ll-speaker-name">' + esc(v.name) + '</div>' +
      '<p class="ll-speaker-quote">' + esc(v.quote) + '</p></div>' +
    '</div>';
  }

  function apply(data){
    var root = document.querySelector('.ll-root');
    if (!root || !data || !data.videos) return;
    /* somebody is already watching one — leave the section alone */
    if (root.querySelector('.ll-video-testi-section iframe')) return;

    var f = data.featured, box = root.querySelector('.ll-video-featured');
    if (f && box){
      var frame = box.querySelector('.ll-video-frame');
      if (frame){
        frame.setAttribute('data-vid', f.id);
        frame.setAttribute('aria-label', 'Play ' + f.name + "'s testimonial");
        var img = frame.querySelector('img');
        if (img) img.src = 'https://img.youtube.com/vi/' + f.id + '/hqdefault.jpg';
      }
      var n = box.querySelector('.ll-speaker-name'); if (n) n.textContent = f.name;
      var q = box.querySelector('.ll-speaker-quote'); if (q) q.textContent = f.quote;
    }

    var grid = document.getElementById('ll-video-grid');
    var more = document.getElementById('ll-video-more');
    var count = document.getElementById('ll-video-count');
    if (!grid) return;
    if (more){ var fresh = more.cloneNode(true); more.parentNode.replaceChild(fresh, more); more = fresh; }
    var list = data.videos, size = data.page_size || 8, shown = 0;
    grid.innerHTML = '';
    function render(k){
      var slice = list.slice(shown, shown + k), html = '';
      for (var i = 0; i < slice.length; i++) html += card(slice[i]);
      grid.insertAdjacentHTML('beforeend', html);
      shown += slice.length;
      var left = list.length - shown;
      if (count) count.textContent = left > 0 ? shown + ' of ' + list.length + ' interviews' : 'All ' + list.length + ' interviews shown';
      if (more){
        if (left > 0){ more.hidden = false; more.textContent = 'Show ' + Math.min(left, size) + ' more'; }
        else more.hidden = true;
      }
    }
    render(size);
    if (more) more.addEventListener('click', function(){ render(size); });
  }

  /* The same section as it is built on the GHL funnel pages ("llt"). */
  function lltFrame(v, thumb, size){
    return '<div class="llt-frame" data-vid="' + esc(v.id) + '">' +
      '<img src="https://img.youtube.com/vi/' + esc(v.id) + '/' + thumb + '.jpg" loading="lazy" alt="' + esc(v.name) + '">' +
      '<button class="llt-play" aria-label="Play ' + esc(v.name) + '\'s interview"><svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>' +
    '</div>';
  }
  function lltMeta(v){
    return '<div class="llt-meta"><div class="llt-name">' + esc(v.name) + '</div>' +
      '<p class="llt-quote">' + esc(v.quote) + '</p></div>';
  }
  function applyLlt(data){
    var root = document.querySelector('.llt');
    if (!root || !data || !data.videos) return;
    if (root.querySelector('iframe')) return;
    var f = data.featured, feat = document.getElementById('lltFeatured');
    if (f && feat){
      feat.className = 'llt-featured';
      feat.innerHTML = lltFrame(f, 'maxresdefault', 26) + lltMeta(f);
    }
    var grid = document.getElementById('lltGrid');
    var more = document.getElementById('lltMore');
    var count = document.getElementById('lltCount');
    if (!grid) return;
    if (more){ var fresh = more.cloneNode(true); more.parentNode.replaceChild(fresh, more); more = fresh; }
    var list = data.videos, size = data.page_size || 8, shown = 0;
    grid.innerHTML = '';
    function render(k){
      var slice = list.slice(shown, shown + k), html = '';
      for (var i = 0; i < slice.length; i++){
        html += '<div class="llt-card' + (shown ? ' llt-new' : '') + '">' + lltFrame(slice[i], 'mqdefault', 20) + lltMeta(slice[i]) + '</div>';
      }
      grid.insertAdjacentHTML('beforeend', html);
      shown += slice.length;
      var left = list.length - shown;
      if (count) count.textContent = left > 0 ? shown + ' of ' + list.length + ' interviews' : 'All ' + list.length + ' interviews shown';
      if (more){
        if (left > 0){ more.hidden = false; more.textContent = 'Show ' + Math.min(left, size) + ' more'; }
        else more.hidden = true;
      }
    }
    render(size);
    if (more) more.addEventListener('click', function(){ render(size); });
  }

  function applyAll(data){
    try { apply(data); } catch (e) {}
    try { applyLlt(data); } catch (e) {}
  }
  function hasSection(){
    return !!(document.getElementById('ll-video-grid') || document.getElementById('lltGrid'));
  }
  /* Once the page's own script has drawn its cards: leadlabcrm.com draws
     them when the page is ready, the funnels as the section loads. */
  function whenDrawn(fn){
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(fn, 0); });
    else setTimeout(fn, 0);
  }

  var KEY = 'll-videos-v1', held = null, shownKey = '';
  try { held = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}

  /* Asked for straight away, while the rest of the page is still loading -
     and only on a page with the video section. */
  var fresh = null;
  function asked(){
    if (!fresh) fresh = fetch(LL_DATA, { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(pages){
        var html = (pages && pages[0] && pages[0].content && pages[0].content.rendered) || '';
        var m = /LLVIDEOS-([0-9a-f]+)/.exec(html);
        return m ? fromHex(m[1]) : null;
      })
      .catch(function(){ return null; });
    return fresh;
  }
  if (hasSection()) asked();

  whenDrawn(function(){
    /* Nothing to do on a page without the video section. */
    if (!hasSection()) return;
    /* The list from this visitor's last visit, at once... */
    if (held && held.videos){ applyAll(held); shownKey = JSON.stringify(held); }
    /* ...and the current one as soon as it arrives, if it's any different. */
    asked().then(function(data){
      if (!data) return;
      var key = JSON.stringify(data);
      try { localStorage.setItem(KEY, key); } catch (e) {}
      if (key !== shownKey) applyAll(data);
    });
  });
})();
</script>
