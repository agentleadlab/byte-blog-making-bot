[project]
name = "wilbyte"
version = "0.1.0"
description = "Wil Byte - turns Agent Lead Lab YouTube videos into scheduled GoHighLevel blog posts"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.1",
    "youtube-transcript-api>=0.6",
    # Pinned exactly: the Docker base image bakes in the matching browser build,
    # and a version skew leaves Playwright looking for a revision that isn't there.
    # Bump this and the Dockerfile's FROM tag together.
    "playwright==1.62.0",
    "discord.py>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wilbyte = "wilbyte.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wilbyte = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
