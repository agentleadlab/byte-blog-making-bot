<!doctype html>
<meta charset="utf-8">
<title>cover</title>
<style>
  __FONT_FACES__

  :root {
    --ink: #ffffff;
    --highlight: #35d07f;
    --highlight-ink: #04150c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: __WIDTH__px;
    height: __HEIGHT__px;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(140% 100% at 0% 0%, #14653a 0%, rgba(6, 24, 14, 0) 55%),
      radial-gradient(120% 120% at 100% 100%, #0d3a22 0%, rgba(0, 0, 0, 0) 55%),
      #050b07;
    font-family: "Anton", "Oswald", "Archivo Black", "Arial Narrow Bold",
                 "Helvetica Neue Condensed", Impact, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: __PAD__px;
    text-align: center;
  }

  /* Subtle vignette so light headline text stays legible over the gradient. */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(90% 70% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
  }

  .logo {
    position: relative;
    z-index: 1;
    margin-bottom: __LOGO_GAP__px;
    flex: 0 0 auto;
  }

  .logo img { height: __LOGO_H__px; width: auto; display: block; }

  .logo-fallback {
    font-size: __LOGO_H__px;
    line-height: 1;
    letter-spacing: .18em;
    color: var(--highlight);
    text-transform: uppercase;
  }

  .kicker {
    position: relative;
    z-index: 1;
    display: inline-block;
    background: var(--highlight);
    color: var(--highlight-ink);
    padding: .18em .5em .24em;
    letter-spacing: .04em;
    line-height: 1;
    text-transform: uppercase;
    margin-bottom: __KICKER_GAP__px;
    flex: 0 0 auto;
  }

  .headline {
    position: relative;
    z-index: 1;
    line-height: .94;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-shadow: 0 __SHADOW__px __SHADOW_BLUR__px rgba(0, 0, 0, .55);
    max-width: 100%;
    flex: 0 0 auto;
  }
</style>

<div class="logo" id="logo">__LOGO_HTML__</div>
<div class="kicker" id="kicker">__KICKER__</div>
<div class="headline" id="headline">__HEADLINE__</div>

<script>
  // Shrink each line until it fits its box. Headline length varies a lot between
  // posts, so the sizes are fitted at render time rather than hard-coded.
  function fit(el, start, min, maxWidth, maxHeight) {
    let size = start;
    el.style.fontSize = size + 'px';
    while (size > min) {
      const tooWide = el.scrollWidth > maxWidth;
      const tooTall = el.scrollHeight > maxHeight;
      if (!tooWide && !tooTall) break;
      size -= 1;
      el.style.fontSize = size + 'px';
    }
    return size;
  }

  const pad = __PAD__;
  const boxWidth = __WIDTH__ - pad * 2;
  const kicker = document.getElementById('kicker');
  const headline = document.getElementById('headline');
  const logo = document.getElementById('logo');

  fit(kicker, __KICKER_SIZE__, 10, boxWidth, __KICKER_MAX_H__);

  const used = logo.offsetHeight + __LOGO_GAP__ + kicker.offsetHeight + __KICKER_GAP__;
  const headlineBox = __HEIGHT__ - pad * 2 - used;
  fit(headline, __HEADLINE_SIZE__, 12, boxWidth, headlineBox);

  document.documentElement.dataset.ready = '1';
</script>
