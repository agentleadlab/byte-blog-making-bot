<!doctype html>
<meta charset="utf-8">
<title>cover</title>
<style>
  __FONT_FACES__

  :root {
    --ink: #ffffff;
    --highlight: #00b86b;
    --highlight-ink: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: __WIDTH__px;
    height: __HEIGHT__px;
    overflow: hidden;
  }

  body {
    /* Green bloom off the top-left corner falling away to near-black. */
    background:
      radial-gradient(90% 120% at 0% 0%, #1f7a4d 0%, rgba(10, 32, 20, 0) 58%),
      radial-gradient(70% 90% at 100% 100%, #0a2e1c 0%, rgba(0, 0, 0, 0) 60%),
      #060a08;
    font-family: "Anton", "Archivo Black", "Oswald", "Arial Narrow", Impact, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: __PAD__px;
    text-align: center;
  }

  .logo {
    flex: 0 0 auto;
    margin-bottom: __LOGO_GAP__px;
  }

  .logo img { height: __LOGO_H__px; width: auto; display: block; }

  .logo-fallback {
    font-size: __WORDMARK__px;
    line-height: 1;
    letter-spacing: .34em;
    text-indent: .34em;         /* re-centre: tracking adds space after the last letter */
    color: #7ee0ac;
    text-transform: uppercase;
    font-family: "Archivo Black", "Anton", sans-serif;
  }

  .kicker {
    flex: 0 0 auto;
    display: inline-block;
    background: var(--highlight);
    color: var(--highlight-ink);
    padding: __KICK_PAD_V__px __KICK_PAD_H__px;
    letter-spacing: .06em;
    line-height: 1;
    text-transform: uppercase;
    margin-bottom: __KICKER_GAP__px;
    font-family: "Archivo Black", "Anton", sans-serif;
  }

  .headline {
    flex: 0 0 auto;
    line-height: 1.02;
    letter-spacing: .005em;
    text-transform: uppercase;
    max-width: __HEADLINE_MAX__px;
    /* Even out the ragged edge instead of leaving one orphan word on line two. */
    text-wrap: balance;
    text-align: center;
  }
</style>

<div class="logo" id="logo">__LOGO_HTML__</div>
<div class="kicker" id="kicker">__KICKER__</div>
<div class="headline" id="headline">__HEADLINE__</div>

<script>
  // Fit each line to its box. Headline length varies a lot between posts, so
  // sizes are measured at render time rather than hard-coded.
  function fit(el, start, min, maxWidth, maxHeight) {
    let size = start;
    el.style.fontSize = size + 'px';
    while (size > min) {
      if (el.scrollWidth <= maxWidth && el.scrollHeight <= maxHeight) break;
      size -= 1;
      el.style.fontSize = size + 'px';
    }
    return size;
  }

  const pad = __PAD__;
  const kicker = document.getElementById('kicker');
  const headline = document.getElementById('headline');
  const logo = document.getElementById('logo');

  // Wait for the embedded faces. Measuring before they load sizes the text
  // against the fallback font, and the screenshot lands mid-swap.
  document.fonts.ready.then(function () {
    fit(kicker, __KICKER_SIZE__, 10, __WIDTH__ - pad * 2, __KICKER_MAX_H__);

    const used = logo.offsetHeight + __LOGO_GAP__ + kicker.offsetHeight + __KICKER_GAP__;
    fit(headline, __HEADLINE_SIZE__, 14, __HEADLINE_MAX__, __HEIGHT__ - pad * 2 - used);

    document.documentElement.dataset.ready = '1';
  });
</script>
